
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASTRA - AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Yu Gothic", sans-serif;
      background: #f3f5f9;
      color: #202938;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 100vh;
      min-height: 500px;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    header {
      padding: 22px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #202938;
      color: white;
      display: grid;
      place-items: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 13px;
      margin-top: 3px;
    }

    /* メッセージ表示欄 */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
      font-size: 15px;
    }

    .bot {
      background: #f0f2f6;
      margin-right: auto;
    }

    .user {
      background: #202938;
      color: white;
      margin-left: auto;
    }

    /* 入力欄 */
    .composer {
      display: flex;
      gap: 10px;
      padding: 18px;
      border-top: 1px solid #e5e7eb;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #d1d5db;
      border-radius: 25px;
      padding: 13px 18px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #64748b;
    }

    button {
      border: none;
      border-radius: 25px;
      background: #202938;
      color: white;
      padding: 0 22px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* スマートフォン対応 */
    @media (max-width: 600px) {
      .app {
        min-height: 100vh;
      }

      #messages {
        padding: 16px;
      }

      .composer {
        padding: 12px;
      }

      .message {
        max-width: 90%;
      }

      button {
        padding: 0 16px;
      }
    }

/* ===== ASTRA 未来的デザイン ===== */

body {
  background: #080f1f;
  color: #e8f1ff;
}

.app {
  background: #0d172b;
  border: 1px solid #243b5a;
  border-radius: 18px;
  box-shadow: 0 0 35px rgba(0, 180, 255, 0.12);
}

/* ヘッダー */
header {
  background: #101d33;
  border-bottom: 1px solid #294361;
  padding: 22px;
}

/* ASTRAロゴ */
.logo {
  background: linear-gradient(135deg, #00c6ff, #4263ff);
  box-shadow: 0 0 20px rgba(0, 198, 255, 0.4);
}

/* ASTRAの名前 */
header h1 {
  color: #ffffff;
  letter-spacing: 2px;
}

/* チャットエリア */
#messages {
  background: #0a1324;
  padding: 22px;
}

/* AIの吹き出し */
.message.bot {
  background: #17263d;
  color: #dcecff;
  border: 1px solid #294361;
  border-radius: 18px;
  box-shadow: 0 0 12px rgba(0, 150, 255, 0.05);
}

  background: linear-gradient(135deg, #174a77, #243c78);
  color: #ffffff;
  border: 1px solid #367fc0;

  background: #101d33;

/* 送信ボタン */

  background: linear-gradient(135deg, #0077ff, #00b8d9);

  border-radius: 14px;

  background: linear-gradient(135deg, #1590ff, #00d4ff);

/* ===== デザインここまで ===== */
  </style>
</head>

<body>

  <div class="app">

    <!-- ASTRAのヘッダー -->
    <header>
      <div class="logo">✦</div>

      <div>
        <h1>ASTRA</h1>
        <div class="subtitle">あなたのAIアシスタント</div>
      </div>
    </header>

    <!-- 会話の表示場所 -->
    <main id="messages">

      <div class="message bot">
        こんにちは！私はASTRAです。
        何でも質問してください。
      </div>

    </main>

    <!-- メッセージ入力欄 -->
    <form class="composer" id="chatForm">

      <input
        id="userInput"
        type="text"
        placeholder="ASTRAにメッセージを入力…"
        autocomplete="off"
      >

      <button id="sendButton" type="submit">
        送信
      </button>

    </form>

  </div>

  <script>
    // ==============================
    // ASTRAとOllamaを接続するプログラム
    // ==============================

    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");

    // Ollamaで使用するAIモデル
    const MODEL = "llama3.2:3b";

    // OllamaのチャットAPI
    const API_URL = "http://localhost:11434/api/chat";

    // 会話履歴
    const history = [];

    // メッセージを画面に表示する関数
    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;

      return message;
    }

    // 送信ボタンを押したときの処理
    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const text = input.value.trim();

      // 空欄なら送信しない
      if (!text) {
        return;
      }

      // 入力したメッセージを画面に表示
      addMessage(text, "user");

      // 入力欄を空にする
      input.value = "";

      // 連続送信を防ぐ
      input.disabled = true;
      sendButton.disabled = true;

      // 会話履歴にユーザーの発言を追加
      history.push({
        role: "user",
        content: text
      });

      // AIの返答を表示する場所を作る
      const loadingMessage = addMessage(
        "ASTRAが考えています…",
        "bot"
      );

      try {
        // Ollamaへ質問を送る
        const response = await fetch(API_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            model: MODEL,

            messages: [
              {
                role: "system",
                content:
                  "あなたはASTRAという名前の親切なAIアシスタントです。日本語でわかりやすく回答してください。"
              },

              ...history
            ],

            // 回答をまとめて受け取る
            stream: false
          })
        });

        // 通信に失敗した場合
        if (!response.ok) {
          throw new Error(
            "Ollamaからエラーが返されました。"
          );
        }

        // AIの返答をJSONとして受け取る
        const data = await response.json();

        // AIの回答を取り出す
        const answer = data.message.content;

        // 「考えています…」をAIの回答に変更
        loadingMessage.textContent = answer;

        // AIの回答を会話履歴に追加
        history.push({
          role: "assistant",
          content: answer
        });

        messages.scrollTop = messages.scrollHeight;

      } catch (error) {
        console.error(error);

        loadingMessage.textContent =
          "申し訳ありません。AIに接続できませんでした。\n\n" +
          "Ollamaが起動しているか確認してください。\n" +
          "エラー：" + error.message;
      }

      // 入力欄と送信ボタンを元に戻す
      input.disabled = false;
      sendButton.disabled = false;

      input.focus();
    });
  </script>

</body>
</html>
